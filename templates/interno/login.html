<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrar — {{ club }}</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
{% include "_head.html" %}
<link rel="stylesheet" href="/static/css/interno.css?v=2">
<style>
  .auth{display:grid; grid-template-columns:minmax(340px,460px) 1fr; min-height:100vh}
  .auth-form{display:flex; flex-direction:column; justify-content:center; padding:48px 52px; background:var(--side);
    border-right:1px solid var(--line)}
  .auth-form .mini{display:none; height:56px; margin-bottom:22px}
  .auth-form h1{font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    font-size:30px; line-height:1; margin:0 0 8px}
  .auth-form p{color:var(--muted); font-size:14px; margin:0 0 28px}
  .auth-form .btn{margin-top:6px}
  .err{display:flex; gap:9px; align-items:center; background:var(--danger-soft); border:1px solid rgba(224,122,111,.35);
    color:#f3c4be; border-radius:var(--r-sm); padding:10px 12px; font-size:13.5px; margin-bottom:18px}
  .auth-art{position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 45%, #15291f 0%, var(--bg) 70%)}
  .auth-art svg.rings{position:absolute; width:min(92vh,880px); height:auto; opacity:.55}
  .auth-art .rings circle{fill:none; stroke:var(--line); stroke-width:1}
  .auth-art .rings line{stroke:#2a4637; stroke-width:1}
  .auth-art img{position:relative; width:min(46%,340px); height:auto; 
    filter:drop-shadow(0 0 1.5px rgba(236,233,218,.9)) drop-shadow(0 0 1.5px rgba(236,233,218,.9)) drop-shadow(0 0 40px rgba(202,190,114,.22))}
  .auth-art .cap{position:absolute; left:0; right:0; bottom:34px; text-align:center; font-family:"Oswald",sans-serif;
    text-transform:uppercase; letter-spacing:.34em; font-size:11px; color:var(--muted)}
  @media (max-width:820px){
    .auth{grid-template-columns:1fr}
    .auth-art{display:none}
    .auth-form{padding:40px 24px; border-right:none}
    .auth-form .mini{display:block}
  }
</style>
</head>
<body>
<div class="auth">
  <form class="auth-form" method="post" action="/login" autocomplete="on">
    <img class="mini" src="/static/logo.png" alt="">
    <h1>Área interna</h1>
    <p>{{ club }} · acesso da recepção, ROs e administração.</p>
    {% if error %}<div class="err"><svg class="ic" aria-hidden="true"><use href="/static/icons.svg#alert"/></svg> Usuário ou senha inválidos.</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="f"><label for="u">Usuário</label>
      <input id="u" type="text" name="username" autocapitalize="none" autocorrect="off" required autofocus></div>
    <div class="f"><label for="p">Senha</label>
      <input id="p" type="password" name="password" required></div>
    <button class="btn btn-gold btn-lg btn-block">Entrar</button>
  </form>
  <div class="auth-art" aria-hidden="true">
    <svg class="rings" viewBox="0 0 400 400">
      <circle cx="200" cy="200" r="190"/><circle cx="200" cy="200" r="140"/><circle cx="200" cy="200" r="90"/>
      <line x1="200" y1="0" x2="200" y2="400"/><line x1="0" y1="200" x2="400" y2="200"/>
    </svg>
    <img src="/static/logo.png" alt="">
    <div class="cap">Inscrições · Linha de tiro · Resultados</div>
  </div>
</div>
</body>
</html>
