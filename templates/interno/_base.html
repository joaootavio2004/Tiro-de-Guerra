<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Interno{% endblock %} — {{ club }}</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
{% include "_head.html" %}
<style>
  /* ---------- área interna ---------- */
  body{padding-bottom:40px}
  .appbar{position:sticky; top:0; z-index:30; background:rgba(10,19,15,.92);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  .appbar .row1{display:flex; align-items:center; gap:12px; height:58px}
  .appbar .row1 img{height:34px}
  .appbar .row1 .name{font-family:"Oswald",sans-serif; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; font-size:14px; line-height:1}
  .appbar .row1 .name small{display:block; color:var(--gold); font-size:9px; letter-spacing:.3em; margin-top:3px}
  .appbar .who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted)}
  .appbar .who b{color:var(--text); font-weight:600}
  .appbar .who form{margin:0}
  .navrow{display:flex; gap:6px; overflow-x:auto; padding:0 0 10px; scrollbar-width:none}
  .navrow::-webkit-scrollbar{display:none}
  .navrow a{white-space:nowrap; text-decoration:none; font-family:"Oswald",sans-serif; font-weight:500;
    letter-spacing:.06em; text-transform:uppercase; font-size:12.5px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:7px 13px; background:var(--surface)}
  .navrow a.on{background:var(--gold); color:var(--ink); border-color:var(--gold)}
  .stagebar{font-size:12.5px; color:var(--muted); padding:10px 0 0}
  .stagebar b{color:var(--gold-bright); font-weight:600}

  main.wrap{padding-top:20px}
  h1.pg{font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    font-size:24px; margin:0 0 4px}
  .lead{color:var(--muted); font-size:14px; margin:0 0 18px}
    .box{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px}
  .box h2{font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    font-size:16px; margin:0 0 12px; color:var(--gold)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px}
  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
  .kpi .v{font-family:"Oswald",sans-serif; font-weight:700; font-size:32px; line-height:1; color:var(--gold-bright)}
  .kpi .l{color:var(--muted); font-size:12px; margin-top:6px; letter-spacing:.06em; text-transform:uppercase}

  .btn{display:inline-flex; align-items:center; gap:6px; font-family:"Oswald",sans-serif; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; font-size:13px; border-radius:999px; border:1px solid transparent; cursor:pointer;
    padding:10px 18px; text-decoration:none; line-height:1; transition:filter .15s; background:var(--surface2); color:var(--text);
    border-color:var(--line)}
  .btn:hover{filter:brightness(1.12)}
  .btn:disabled{opacity:.4; cursor:not-allowed; filter:none}
  .btn-gold{background:var(--gold); color:var(--ink); border-color:var(--gold)}
  .btn-danger{background:transparent; color:#e88; border-color:#7a3a3a}
  .btn-ghost{background:transparent}
  .btn-sm{padding:7px 12px; font-size:11.5px}
  .btn-lg{padding:16px 26px; font-size:16px}
  .btn-block{width:100%; justify-content:center}
  form.inline{display:inline}

  label{font-family:"Oswald",sans-serif; font-weight:500; text-transform:uppercase; letter-spacing:.1em;
    font-size:11px; color:var(--muted); display:block; margin-bottom:5px}
  input[type=text],input[type=password],input[type=number],input[type=search],select{
    width:100%; border:1px solid var(--line); border-radius:10px; background:var(--ink);
    padding:11px 12px; font-family:"Inter",sans-serif; font-size:15px; color:var(--text)}
  input:focus,select:focus{outline:2px solid var(--gold); outline-offset:1px}
  .f{margin-bottom:12px}
  .frow{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; align-items:end}
  .search{position:relative}
  .search input{padding-left:40px; text-transform:uppercase}
  .search::before{content:"⌕"; position:absolute; left:14px; top:50%; transform:translateY(-55%);
    font-size:20px; color:var(--gold)}

  .list{display:flex; flex-direction:column; gap:8px}
  .item{display:flex; align-items:center; gap:12px; background:var(--surface2); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px}
  .item .who{flex:1; min-width:0}
  .item .nm{font-family:"Oswald",sans-serif; font-weight:600; text-transform:uppercase; font-size:16px; line-height:1.1}
  .item .meta{color:var(--muted); font-size:12.5px; margin-top:3px}
  .item.done{opacity:.72}
  .tag{font-family:"Oswald",sans-serif; font-weight:600; font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; border-radius:999px; padding:3px 9px; background:var(--gold-soft); color:var(--gold)}
  .tag.ok{background:rgba(127,176,105,.15); color:#9fd48a}
  .tag.wait{background:rgba(202,190,114,.08); color:var(--muted)}
  .tag.red{background:rgba(220,80,80,.15); color:#f0a0a0}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .sep{height:1px; background:var(--line); margin:14px 0}
  .sub-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
  .sub-tabs button{font-family:"Oswald",sans-serif; font-weight:500; letter-spacing:.06em; text-transform:uppercase;
    font-size:12.5px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:7px 13px;
    background:var(--surface); cursor:pointer}
  .sub-tabs button.on{background:var(--gold); color:var(--ink); border-color:var(--gold)}
  .hide{display:none !important}

  .flash{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--gold); color:var(--ink);
    border-radius:999px; padding:10px 20px; font-size:14px; font-weight:600; z-index:40;
    box-shadow:0 8px 24px rgba(0,0,0,.35); animation:flashout 5s forwards}
  @keyframes flashout{0%,80%{opacity:1}100%{opacity:0; visibility:hidden}}
  .conn{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted)}
  .dot{width:9px; height:9px; border-radius:50%; background:#b44}
  .dot.on{background:#7fb069; box-shadow:0 0 0 0 rgba(127,176,105,.5); animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,176,105,.5)}70%{box-shadow:0 0 0 8px rgba(127,176,105,0)}100%{box-shadow:0 0 0 0 rgba(127,176,105,0)}}
  table.plain{width:100%; border-collapse:collapse; font-size:14px}
  table.plain th{text-align:left; font-family:"Oswald",sans-serif; font-weight:500; letter-spacing:.08em;
    text-transform:uppercase; font-size:11px; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line)}
  table.plain td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.plain tr:last-child td{border-bottom:none}
  .num{font-variant-numeric:tabular-nums; font-family:"Oswald",sans-serif}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr} .appbar .who span.nm{display:none} }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <div class="row1">
      <img src="/static/logo.png" alt="">
      <span class="name">Guerra<small>Área interna</small></span>
      <div class="who">
        <span class="nm"><b>{{ user.name }}</b> · {{ role_label(user.role) }}</span>
        <form method="post" action="/interno/logout"><button class="btn btn-ghost btn-sm">Sair</button></form>
      </div>
    </div>
    <nav class="navrow">
      <a href="/interno" class="{% if path in ('/interno','/interno/') %}on{% endif %}">🏠 Início</a>
      {% for n in nav %}
      <a href="{{ n[1] }}" class="{% if path.startswith(n[1]) %}on{% endif %}">{{ n[3] }} {{ n[2] }}</a>
      {% endfor %}
    </nav>
  </div>
</header>

<main class="wrap">
  {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
