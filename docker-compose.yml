# Para o Coolify: recurso do tipo "Docker Compose" apontando para este
# repositório. No serviço "app", configure os dois domínios:
#   https://tirodeguerra.com.br,https://admin.tirodeguerra.com.br  (porta 8000)
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - CLUB_NAME=${CLUB_NAME:-GUERRA Clube de Tiro}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SITE_URL=${SITE_URL:-https://tirodeguerra.com.br}
      - ADMIN_HOST=${ADMIN_HOST:-admin.tirodeguerra.com.br}
      - TZ=${TZ:-America/Sao_Paulo}
      - PORT=8000
      - DB_PATH=/app/data/tiro_guerra.db
    ports:
      - "8000:8000"
    volumes:
      - tiroguerra_data:/app/data

volumes:
  tiroguerra_data:
